version: "3.9"

# CabinGuard AI — Docker Compose
# Brings up Kafka, Zookeeper, and optional NiFi.
# For local development; swap broker addresses for cloud Kafka in production.

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: cabinguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cabinguard-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cabinguard-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cabinguard-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  # Optional: Apache NiFi for visual flow-based ingestion design
  # Uncomment to enable. Takes ~2 min to start on first launch.
  # nifi:
  #   image: apache/nifi:1.26.0
  #   container_name: cabinguard-nifi
  #   ports:
  #     - "8443:8443"
  #   environment:
  #     SINGLE_USER_CREDENTIALS_USERNAME: admin
  #     SINGLE_USER_CREDENTIALS_PASSWORD: cabinguard_nifi_pw

volumes:
  kafka-data:
